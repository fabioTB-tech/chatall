{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	{% block head %}{% endblock %}
	<style>
	@charset "UTF-8";

    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap");
    
    :root {
        --main-color: #e0b9ff;
        --main-color2: #cbbfd5;
        --comp-color1: #baffd4;
        --comp-color2: #ffe5ba;
        --font-color1: #3e2255;
        --font-color2: #e8ccff;
        --box-color: #efefef;
        --background1: #3e2255;
        --background2: #221c33;
    }
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
    }
    
    body {
        width: 100vw;
        min-height: 100dvh;
        background: linear-gradient(180deg, var(--background1), var(--background2));
        color: var(--font-color2);
    }
    
    main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
    
        h1 {
            text-align: center;
            font-size: 4rem;
            font-weight: bold;
            margin: 70px 0 50px 0;
        }
    }
    
    div#container {
        width: 1004px;
        height: 544px;
        background-color: rgba(0, 0, 0, 0.2);
        color: var(--font-color1);
        box-shadow: 5px 5px 12px 5px #00000055;
    
        overflow: hidden;
        border-radius: 15px;
    
        display: flex;
    }
    
    div#form {
        background-color: var(--box-color);
        padding: 30px;
        width: 50%;
    
        h2 {
            text-align: center;
            font-size: 1.3rem;
        }
    }
    
    button#btn-sent {
        padding: 16px;
        margin-top: 35px;
        width: 100%;
        border: none;
        border-radius: 1cm;
        background-color: var(--comp-color1);
        color: var(--font-color1);
        box-shadow: 2px 2px 5px #00000050;
        font-size: 1.2rem;
        font-weight: bold;
        transition: 0.3s;
    }
    
    button#btn-sent:hover {
        cursor: pointer;
        opacity: 0.8;
    }
    
    div#links {
        font-size: 0.7rem;
        margin: 5px 12px;
        width: 95%;
        color: #2e2e2e;
    
        display: flex;
        justify-content: space-between;
    }
    
    div#img {
        background-color: var(--main-color2);
        width: 50%;
        display: flex;
        justify-content: center;
    }
    
    input {
        padding: 8px 10px;
        border: none;
        border-radius: 1cm;
    }
    
	</style>
</head>
<body class="bg-light">
    <main>
        <h1>Login</h1>
        <div id="container">
            <div id="form">
                <h2>{% block greetings %}{% endblock %}</h2>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div id="input-field" class="d-flex flex-column mb-3">
                        <label>{{ field.label }}</label>
                        {{ field }}
                    </div>
                    {% endfor %}
                    <div><button type="submit" id="btn-sent">Enviar</button></div>
                </form>
                {% block links %}{% endblock %}
            </div>
            <div id="img">
                <img
                    src="{% static 'img/login.svg' %}"
                    alt="login svg"
                    style="width: 444px"
                />
            </div>
        </div>
    </main>
    {% block body %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
