<section class="d-none d-xxl-block card shadow" 
    style="
    position: absolute; 
    width: 18%; 
    top: 12%; 
    right: 50px;"
>
    <div class="card-header">
        Perfis
    </div>
    <ul class="list-group list-group-flush">
        {% for perfil in profiles %}
        {% if perfil.user != request.user %}
        <li class="list-group-item">
            <a href="{% url 'profile' perfil.user.id %}" class="d-flex align-items-center">
                <img 
                    src="{{ perfil.avatar.url }}" 
                    alt="{{ perfil.user.username }}'s Profile Image" 
                    class="mx-3 border"
                    style="width: 40px; height: 40px; border-radius: 50%;">
                {{ perfil.user.username }}
            </a>
        </li>
        {% endif %}
        {% endfor %}
    </ul>
</section>
