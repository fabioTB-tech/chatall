{% load static %}
<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    body {
        color: #3e2255;
    }

    header {
        background-color: #e0b9ff;

        p {
            margin: 0;
        }
    }
    header h1 {
        font-weight: bold;
        text-shadow: 2px 2px 5px #00000025;
        margin: 0;
    }

    button#profile, a {
        color: inherit;
        text-decoration: none;
    }

    header img {
        width: 50px;
        height: 50px;
        border-radius: 1cm;
    }

    div#nav {
        a,
        button {
            background-color: #baffd4;
        }
    }
    
    button#profile {
        background-color: transparent;
        border: none;
    }
</style>

<header class="row row-cols-3 text-center align-items-center p-2 border-bottom shadow-sm">
    <div class="col">
        {% if user.is_authenticated %}
        <button
            id="profile"
            class="d-flex gap-3 mx-3 align-items-center justify-content-center"
        >
            {% if user.is_authenticated %}
                {% if request.user.perfil.avatar %}
                <img
                    src="{{ request.user.perfil.avatar.url }}"
                    alt="{{ request.user.username }}"
                    style="background-color: transparent"
                />
                {% else %}
                <img
                    src="{% static 'img/default_pfp.png' %}"
                    alt="{{ request.user.username }}"
                    style="background-color: transparent"
                />
                {% endif %}
            <p>{{ user.username }}</p>
            {% else %}
            <img src="{% static 'img/default_pfp.png' %}" alt="user pfp" />
            <p>Profile</p>
            {% endif %}
        </button>
        {% endif %}
    </div>
    <h1 class="col"><a href="{% url 'home' %}">Chat.All</a></h1>
    {% if user.is_authenticated %}
    {% else %}
    <div id="nav" class="col">
        <a href="{% url 'login' %}" class="btn rounded-pill p-2 px-4 fw-bold"
            >entrar</a
        >
        <a href="{% url 'register' %}" class="btn rounded-pill p-2 px-4 fw-bold"
            >cadastrar</a
        >
    </div>
    {% endif %}
</header>

<!-- Nav tab -->
{% if user.is_authenticated %}
<div id="nav-tab" class="d-none h-100 w-100 fixed-top" style="background-color: #00000050;">
    <nav class="w-25 h-100 p-3 bg-body border d-flex flex-column align-items-center">
        <div class="text-center">
            <img 
                src="{{ user.perfil.avatar.url }}" 
                alt="{{ user.username }}"
                width="250"
                class="rounded-circle"
            >
            <p class="my-3 fw-bold fs-4">{{ user.username }}</p>
        </div>
        <div class="w-75">
            <ul class="nav flex-column gap-3 border-top fs-5 fw-bold">
                <li class="nav-item">
                    <a class="nav-link link-dark mt-5" href="{% url 'profile' request.user.id %}">Meu perfil</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark" href="{% url 'galery' %}">Galeria</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" href="#">Feedback</a>
                </li>
                <li class="nav-item">
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="nav-link link-dark">
                            Sair
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>
</div>
{% endif %}

<script>
const btn_profile = document.getElementById('profile')
const outside_area = document.getElementById('nav-tab')

btn_profile.addEventListener('click', () => {
  outside_area.classList.remove('d-none')
})

outside_area.addEventListener('click', () => {
  if (outside_area.classList != 'd-none') {
    outside_area.classList.add('d-none')
  }
})
</script>
