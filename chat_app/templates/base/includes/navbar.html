{% load static %}
<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    body {
        color: #3e2255;
    }

    header {
        background-color: #e0b9ff;
        z-index: 1;

        p {
            margin: 0;
        }
    }
    header h1 {
        font-weight: bold;
        text-shadow: 2px 2px 5px #00000025;
        margin: 0;
    }

    button#profile, a {
        color: inherit;
        text-decoration: none;
    }

    header img {
        width: 50px;
        height: 50px;
        border-radius: 1cm;
    }

    div#nav {
        a,
        button {
            background-color: #baffd4;
        }
    }
    
    button#profile {
        background-color: transparent;
        border: none;
    }

    @media screen and (min-width: 768px) {
        nav#sidenav-tab {
            max-width: 25%;
        }
    }
    
    i.fa-heart {
        color: #e0b9ff;
    }
</style>

<header class="position-sticky top-0 row row-cols-3 text-center align-items-center p-2 border-bottom shadow-sm">
    <div class="col">
        <button
            id="profile"
            class="d-flex gap-3 mx-3 align-items-center justify-content-center"
        >
            {% if user.is_authenticated %}
                {% if request.user.perfil.avatar %}
                <img
                    src="{{ request.user.perfil.avatar.url }}"
                    alt="{{ request.user.username }}"
                    style="background-color: transparent"
                />
                {% else %}
                <img
                    src="{% static 'img/default_pfp.png' %}"
                    alt="{{ request.user.username }}"
                    style="background-color: transparent"
                />
                {% endif %}
            <p class="d-none d-lg-inline">{{ user.username }}</p>
            {% else %}
            <img src="{% static 'img/default_pfp.png' %}" alt="user pfp" />
            <p class="d-none d-lg-inline">Profile</p>
            {% endif %}
        </button>
    </div>
    <h1 class="col"><a href="{% url 'home' %}">Chat.All</a></h1>
</header>

{% comment %} nav tab {% endcomment %}
<div id="nav-tab" class="d-none h-100 w-100 fixed-top" style="background-color: #00000050;">
    <nav id="sidenav-tab" class="w-75 h-100 p-3 bg-body border d-flex flex-column align-items-center">
        <div class="text-center">
            <img 
                src="{{ user.perfil.avatar.url }}" 
                alt="{{ user.username }}"
                width="250"
                height="250"
                class="rounded-circle border shadow"
            >
            <p class="my-3 fw-bold fs-lg-4">{{ user.username }}</p>
        </div>
        <div class="w-75">
            {% if user.is_authenticated %}
            <ul class="nav flex-column gap-3 border-top fs-5 fw-bold">
                <li class="nav-item">
                    <a class="nav-link link-dark mt-lg-5" href="{% url 'home' %}">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark" href="{% url 'profile' request.user.username %}">Meu perfil</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark" href="{% url 'people' %}">Pessoas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark" href="{% url 'galery' %}">Galeria</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark" href="{% url 'feedback' %}">Feedback</a>
                </li>
                <li class="nav-item">
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="nav-link link-dark">
                            Sair
                        </button>
                    </form>
                </li>
            </ul>
            {% else %}
            <ul class="nav flex-column gap-3 border-top fs-5 fw-bold">
                <li class="nav-item mt-lg-3">
                    <a class="nav-link link-dark" href="{% url 'login' %}">Entrar</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark" href="{% url 'register' %}">Cadastrar</a>
                </li>
            </ul>
            {% endif %}
        </div>
    </nav>
</div>

<script>
const btn_profile = document.getElementById('profile')
const outside_area = document.getElementById('nav-tab')

btn_profile.addEventListener('click', () => {
  outside_area.classList.remove('d-none')
})

outside_area.addEventListener('click', () => {
  if (outside_area.classList != 'd-none') {
    outside_area.classList.add('d-none')
  }
})
</script>
