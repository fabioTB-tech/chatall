{% extends 'base/base.html' %}
{% load static %}

{% block head %}
<title>Editar perfil</title>
<style>
    div#img-conteiner img {
        width: 250px;
        height: 250px;
        margin-bottom: 15px;
    }
</style>
{% endblock %}

{% block body %}
<main class="w-100 h-lg-75 d-flex justify-content-center">
    <div class="d-flex flex-column flex-lg-row justify-content-around container-fluid container-lg bg-body mt-lg-5 shadow-lg rounded-3">
        <div id="img-conteiner" class="p-5 d-flex flex-column align-items-center">
            {% if request.user.perfil.avatar %}
            <img src="{{ request.user.perfil.avatar.url }}" alt="{{ user.username }}" class="rounded-circle border">
            {% else %}
            <img src="{% static 'img/default_pfp.png' %}" alt="{{ user.username }}" class="rounded-circle border">
            {% endif %}
            <p class="fw-bold">{{ user.username }}</p>
        </div>
        
        <div class="w-100">
            <form method="post" enctype="multipart/form-data" class="d-flex flex-column p-5">
                {% csrf_token %}
                <div class="d-flex flex-column mb-4">
                    <label for="avatar">Avatar</label>
                    <input type="file" name="avatar" id="avatar" class="form-control">
                </div>
                <div class="d-flex flex-column mb-4">
                    <label for="desc">Descrição</label>
                    <textarea name="desc" id="desc" rows="5" class="form-control">{{ request.user.perfil.bio }}</textarea>
                </div>
                <button class="btn btn-outline-primary" type="submit">Salvar</button>
            </form>
        </div>
    </div>
</main>
{% endblock %}
